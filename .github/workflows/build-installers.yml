name: Build installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Optional version override for a non-release test build (for example 1.2.3)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: installers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            bundles: deb,appimage
            artifact: md-easy-linux
            paths: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
          - name: Windows
            os: windows-2022
            bundles: msi,nsis
            artifact: md-easy-windows
            paths: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*-setup.exe

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget \
            xdg-utils

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.5.0

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Apply release version
        if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
        shell: bash
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', inputs.version) }}
        run: node scripts/apply-version-from-tag.mjs "$RELEASE_TAG"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, pinned
        with:
          toolchain: 1.88.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend
        run: pnpm check

      - name: Test frontend
        run: pnpm test

      - name: Test Rust
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build installers
        run: pnpm tauri build --ci --bundles "${{ matrix.bundles }}" -- --locked

      - name: Upload installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          overwrite: true
          if-no-files-found: error
          path: ${{ matrix.paths }}

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Verify release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          read -r type target < <(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '[.object.type, .object.sha] | @tsv')
          if [[ "$type" == tag ]]; then
            read -r type target < <(gh api "repos/$GITHUB_REPOSITORY/git/tags/$target" --jq '[.object.type, .object.sha] | @tsv')
          fi
          [[ "$type" == commit ]] || { printf 'Tag does not resolve directly to a commit\n' >&2; exit 1; }
          [[ "$target" == "$GITHUB_SHA" ]] || { printf 'Tag moved: expected %s, found %s\n' "$GITHUB_SHA" "$target" >&2; exit 1; }
          default_branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$default_branch" --jq .status)
          [[ "$status" == identical || "$status" == ahead ]] || { printf 'Tag is not on %s\n' "$default_branch" >&2; exit 1; }

      - name: Download installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name md-easy-linux --dir artifacts/md-easy-linux
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name md-easy-windows --dir artifacts/md-easy-windows

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          appimages=(artifacts/md-easy-linux/appimage/*.AppImage)
          debs=(artifacts/md-easy-linux/deb/*.deb)
          msis=(artifacts/md-easy-windows/msi/*.msi)
          nsis=(artifacts/md-easy-windows/nsis/*-setup.exe)
          [[ ${#appimages[@]} -eq 1 && ${#debs[@]} -eq 1 && ${#msis[@]} -eq 1 && ${#nsis[@]} -eq 1 ]] || {
            printf 'Expected one AppImage, DEB, MSI and NSIS installer; found %s, %s, %s and %s\n' \
              "${#appimages[@]}" "${#debs[@]}" "${#msis[@]}" "${#nsis[@]}" >&2
            exit 1
          }
          files=("${appimages[0]}" "${debs[0]}" "${msis[0]}" "${nsis[0]}")
          for file in "${files[@]}"; do
            [[ -f "$file" && ! -L "$file" && -s "$file" ]] || { printf 'Invalid installer: %s\n' "$file" >&2; exit 1; }
          done
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "md-easy ${GITHUB_REF_NAME#v}"
