name: Build installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional PR number for a maintainer retry or CI migration
        required: false
        type: string
      expected_sha:
        description: Immutable PR head SHA, required with pr_number
        required: false
        type: string
      version:
        description: Optional version override for a main or tag test build, which publishes nothing
        required: false
        type: string

permissions:
  contents: read

# PR pushes cancel obsolete runs and replace queued intermediate revisions.
# Manual PR retries use a separate group during migration from the old gate.
# Every main run is preserved and publishes its own release candidate, and tag
# runs serialize rather than cancel.
concurrency:
  group: installers-auto-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || inputs.pr_number != '' && format('manual-pr-{0}', inputs.pr_number) || github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main') }}

jobs:
  prepare:
    name: Select build revision
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mode: ${{ steps.revision.outputs.mode }}
      head_sha: ${{ steps.revision.outputs.head_sha }}
      head_repository: ${{ steps.revision.outputs.head_repository }}
      head_branch: ${{ steps.revision.outputs.head_branch }}
      default_branch: ${{ steps.revision.outputs.default_branch }}
      pr_number: ${{ steps.revision.outputs.pr_number }}
    steps:
      # The PR head may predate this helper. Load controls from the same revision
      # as the workflow, then keep application builds pinned to the event head.
      - name: Check out workflow controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Select the immutable source
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci.mjs prepare

  # GITHUB_TOKEN-created tags do not start workflows, so this run builds and
  # publishes the candidate itself. See docs/releasing.md.
  candidate:
    name: Tag release candidate
    needs: prepare
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Check out workflow controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Tag the next release candidate
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs candidate

  build:
    needs: [prepare, candidate]
    # Main pushes build the version of their candidate tag. Other runs skip that
    # job. Without a tag, the build still runs its tests but publishes nothing.
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    permissions:
      actions: read
      contents: read
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-26.04
            artifact: downpad-linux
            paths: |
              release/*.deb
              release/*.AppImage
          - name: Windows
            os: windows-2025
            artifact: downpad-windows
            paths: |
              release/*.msi

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.prepare.outputs.head_repository }}
          ref: ${{ needs.prepare.outputs.head_sha }}
          persist-credentials: false

      # Older source revisions may lack the current Node pin and CLI installer.
      - name: Check out workflow controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: dev-temp/workflow-controls
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: dev-temp/workflow-controls/.node-version
          cache: pnpm

      - name: Install pinned GitHub CLI
        if: needs.prepare.outputs.head_repository == github.repository
        run: node dev-temp/workflow-controls/scripts/install-github-cli.mjs

      - name: Apply release version
        if: needs.prepare.outputs.mode == 'regular' && (needs.candidate.outputs.tag != '' || startsWith(github.ref, 'refs/tags/') || inputs.version != '')
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.candidate.outputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || format('v{0}', inputs.version) }}
        run: node scripts/apply-version-from-tag.mjs "$RELEASE_TAG"

      # Reuse installers only when both the source commit and app version match.
      # Copy them into this run so tagged releases can still publish artifacts.
      - name: Read app version
        id: version
        shell: bash
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][A-Za-z0-9.-]+)?$ ]]
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Reuse an existing build of this commit
        id: existing
        if: needs.prepare.outputs.head_repository == github.repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_PREFIX: ${{ matrix.artifact }}
          BUILD_SHA: ${{ needs.prepare.outputs.head_sha }}
          DEFAULT_BRANCH: ${{ needs.prepare.outputs.default_branch }}
          BUILD_MODE: ${{ needs.prepare.outputs.mode }}
          HEAD_BRANCH: ${{ needs.prepare.outputs.head_branch }}
        run: |
          set -euo pipefail
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          artifact="$ARTIFACT_PREFIX-$version-$BUILD_SHA"
          printf 'artifact=%s\n' "$artifact" >> "$GITHUB_OUTPUT"
          printf 'reused=false\n' >> "$GITHUB_OUTPUT"
          # PR retries reuse only same-repository PR builds. Releases reuse only
          # successful default-branch pushes, keeping release provenance intact.
          cache_event=push
          cache_branch="$DEFAULT_BRANCH"
          if [[ "$BUILD_MODE" == pr ]]; then
            cache_event=pull_request
            cache_branch="$HEAD_BRANCH"
          fi
          if ! run_ids=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/build-installers.yml/runs" \
            -f head_sha="$BUILD_SHA" -f branch="$cache_branch" -f event="$cache_event" \
            -f status=success -f per_page=100 \
            --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID and .event == \"$cache_event\" and .head_sha == \"$BUILD_SHA\" and .head_repository.full_name == \"$GITHUB_REPOSITORY\") | .id"); then
            printf 'Installer cache lookup failed. Building fresh.\n'
            exit 0
          fi
          cache_directory=dev-temp/installer-cache
          shopt -s nullglob
          for run_id in $run_ids; do
            if ! artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
              --jq ".artifacts[] | select(.name == \"$artifact\" and .expired == false and .size_in_bytes > 0) | .id"); then
              printf 'Installer cache artifact lookup failed for run %s.\n' "$run_id"
              continue
            fi
            [[ -n "$artifact_id" ]] || continue
            rm -rf -- "$cache_directory"
            if ! gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir "$cache_directory"; then
              printf 'Installer cache download failed for run %s.\n' "$run_id"
              continue
            fi
            if [[ "$ARTIFACT_PREFIX" == downpad-linux ]]; then
              debs=("$cache_directory"/*.deb)
              appimages=("$cache_directory"/*.AppImage)
              [[ ${#debs[@]} -eq 1 && ${#appimages[@]} -eq 1 ]] || continue
              files=("${debs[0]}" "${appimages[0]}")
            else
              files=("$cache_directory"/*.msi)
              [[ ${#files[@]} -eq 1 ]] || continue
            fi
            valid=true
            for file in "${files[@]}"; do
              [[ -f "$file" && ! -L "$file" && -s "$file" ]] || valid=false
            done
            [[ "$valid" == true ]] || continue
            mkdir -p release
            cp -- "${files[@]}" release/
            printf 'reused=true\n' >> "$GITHUB_OUTPUT"
            break
          done
          rm -rf -- "$cache_directory"

      - name: Install dependencies
        if: steps.existing.outputs.reused != 'true'
        run: pnpm install --frozen-lockfile

      # Electron downloads lazily. Install before configuring its sandbox.
      - name: Install Electron runtime
        if: steps.existing.outputs.reused != 'true'
        run: pnpm exec install-electron

      - name: Check app
        if: steps.existing.outputs.reused != 'true'
        run: pnpm check

      - name: Test app
        if: steps.existing.outputs.reused != 'true'
        run: pnpm test

      - name: Install Linux desktop test dependencies
        if: steps.existing.outputs.reused != 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2t64 libatk-bridge2.0-0t64 libcups2t64 libgbm1 libgtk-3-0t64 \
            libnss3 libxcomposite1 libxdamage1 libxkbcommon0 libxrandr2 \
            xauth xvfb

      - name: Build app
        if: steps.existing.outputs.reused != 'true'
        run: pnpm build

      - name: Test Linux desktop
        if: steps.existing.outputs.reused != 'true' && runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          xvfb-run -a pnpm test:electron

      - name: Test Windows desktop
        if: steps.existing.outputs.reused != 'true' && runner.os == 'Windows'
        run: pnpm test:electron

      - name: Build installers
        if: steps.existing.outputs.reused != 'true'
        run: pnpm exec electron-builder --publish never

      - name: Test the MSI wizard and installed app
        if: steps.existing.outputs.reused != 'true' && runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = @(Get-ChildItem release -Filter *.msi)
          if ($msi.Count -ne 1) { throw "Expected one MSI, found $($msi.Count)" }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version -replace '-rc\d+$', ''
          ./dev-temp/workflow-controls/scripts/test-msi.ps1 -Msi $msi[0].FullName -ExpectedExecutable release/win-unpacked/Downpad.exe -ExpectedVersion "$version.0" -Scenario fresh

      # PR artifacts use 0.0.0, which cannot expose RC file-version truncation.
      # Package the fixtures normally so they pass through PE resource editing.
      - name: Build stable and release candidate MSI test packages
        if: steps.existing.outputs.reused != 'true' && runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = [IO.File]::ReadAllBytes('package.json')
          try {
            node scripts/apply-version-from-tag.mjs v0.0.1
            if ($LASTEXITCODE -ne 0) { throw 'Could not apply the stable fixture version' }
            pnpm exec electron-builder --win msi --x64 --publish never -c.directories.output=dev-temp/msi-tests/stable
            if ($LASTEXITCODE -ne 0) { throw 'Could not build the stable fixture' }
            node scripts/apply-version-from-tag.mjs v0.0.2-rc1
            if ($LASTEXITCODE -ne 0) { throw 'Could not apply the candidate fixture version' }
            pnpm exec electron-builder --win msi --x64 --publish never -c.directories.output=dev-temp/msi-tests/candidate
            if ($LASTEXITCODE -ne 0) { throw 'Could not build the candidate fixture' }
            node scripts/apply-version-from-tag.mjs v0.0.2-rc2
            if ($LASTEXITCODE -ne 0) { throw 'Could not apply the recovery fixture version' }
            pnpm exec electron-builder --win msi --x64 --publish never -c.directories.output=dev-temp/msi-tests/recovery
            if ($LASTEXITCODE -ne 0) { throw 'Could not build the recovery fixture' }
          } finally {
            [IO.File]::WriteAllBytes('package.json', $manifest)
          }

      - name: Test stable to release candidate MSI upgrade
        if: steps.existing.outputs.reused != 'true' && runner.os == 'Windows'
        shell: powershell
        run: |
          ./dev-temp/workflow-controls/scripts/test-msi.ps1 -PreviousMsi dev-temp/msi-tests/stable/Downpad-0.0.1-win-x64.msi -Msi dev-temp/msi-tests/candidate/Downpad-0.0.2-rc1-win-x64.msi -ExpectedExecutable dev-temp/msi-tests/candidate/win-unpacked/Downpad.exe -ExpectedVersion 0.0.2.0 -Scenario upgrade

      - name: Test MSI recovery from a missing executable
        if: steps.existing.outputs.reused != 'true' && runner.os == 'Windows'
        shell: powershell
        run: |
          ./dev-temp/workflow-controls/scripts/test-msi.ps1 -PreviousMsi dev-temp/msi-tests/candidate/Downpad-0.0.2-rc1-win-x64.msi -Msi dev-temp/msi-tests/recovery/Downpad-0.0.2-rc2-win-x64.msi -ExpectedExecutable dev-temp/msi-tests/recovery/win-unpacked/Downpad.exe -ExpectedVersion 0.0.2.0 -Scenario recovery -RecoverMissingExecutable

      - name: Upload MSI test diagnostics
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msi-test-diagnostics-${{ needs.prepare.outputs.head_sha }}
          overwrite: true
          retention-days: 14
          if-no-files-found: ignore
          path: dev-temp/msi-tests/diagnostics/

      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}-${{ steps.version.outputs.version }}-${{ needs.prepare.outputs.head_sha }}
          overwrite: true
          retention-days: 30
          if-no-files-found: error
          path: ${{ matrix.paths }}

  reviewed-ci:
    name: reviewed-ci
    needs: [prepare, build]
    if: always() && (github.event_name == 'pull_request' || inputs.pr_number != '')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require every build and test to pass
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$PREPARE_RESULT/$BUILD_RESULT" = success/success

  legacy-pr-status:
    name: Report migration CI result
    needs: [prepare, build, reviewed-ci]
    if: always() && needs.prepare.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.pr_number != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Check out workflow controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Replace the previous gate's status with the actual CI result
        env:
          GH_TOKEN: ${{ github.token }}
          CI_PREPARE_RESULT: ${{ needs.prepare.result }}
          CI_BUILD_RESULT: ${{ needs.build.result }}
          CI_GATE_RESULT: ${{ needs.reviewed-ci.result }}
        run: node scripts/ci.mjs finish

  # A main push publishes its candidate as a prerelease. A pushed stable tag
  # publishes a release, which the finalize job then makes the latest release.
  release:
    name: GitHub Release
    needs: [prepare, candidate, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event_name == 'push' && needs.prepare.outputs.mode == 'regular' && needs.prepare.outputs.head_sha == github.sha && needs.prepare.outputs.head_repository == github.repository && (needs.candidate.outputs.tag != '' || startsWith(github.ref, 'refs/tags/')) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_TAG: ${{ needs.candidate.outputs.tag || github.ref_name }}
    steps:
      - name: Check out workflow controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install pinned GitHub CLI
        run: node scripts/install-github-cli.mjs

      - name: Verify release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          read -r type target < <(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '[.object.type, .object.sha] | @tsv')
          if [[ "$type" == tag ]]; then
            read -r type target < <(gh api "repos/$GITHUB_REPOSITORY/git/tags/$target" --jq '[.object.type, .object.sha] | @tsv')
          fi
          [[ "$type" == commit ]] || { printf 'Tag does not resolve directly to a commit\n' >&2; exit 1; }
          [[ "$target" == "$GITHUB_SHA" ]] || { printf 'Tag moved, expected %s, found %s\n' "$GITHUB_SHA" "$target" >&2; exit 1; }
          default_branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$default_branch" --jq .status)
          [[ "$status" == identical || "$status" == ahead ]] || { printf 'Tag is not on %s\n' "$default_branch" >&2; exit 1; }

      - name: Download installers
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ needs.prepare.outputs.head_sha }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "downpad-linux-${RELEASE_TAG#v}-$BUILD_SHA" --dir artifacts/downpad-linux
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "downpad-windows-${RELEASE_TAG#v}-$BUILD_SHA" --dir artifacts/downpad-windows

      # The release must carry exactly these files. The cleanup after a stable
      # release checks for the same names (scripts/release.mjs).
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          files=(
            "artifacts/downpad-linux/Downpad-$version-linux-x86_64.AppImage"
            "artifacts/downpad-linux/Downpad-$version-linux-amd64.deb"
            "artifacts/downpad-windows/Downpad-$version-win-x64.msi"
          )
          shopt -s nullglob
          found=(artifacts/*/*)
          [[ ${#found[@]} -eq ${#files[@]} ]] || { printf 'Expected only %s, found %s\n' "${files[*]}" "${found[*]}" >&2; exit 1; }
          for file in "${files[@]}"; do
            [[ -f "$file" && ! -L "$file" && -s "$file" ]] || { printf 'Missing or invalid installer %s\n' "$file" >&2; exit 1; }
          done
          for file in "${files[@]}"; do
            printf '%s  %s\n' "$(sha256sum "$file" | cut -d ' ' -f 1)" "$(basename "$file")"
          done > SHA256SUMS
          kind=()
          [[ "$version" != *-rc* ]] || kind=(--prerelease)
          # Only the finalize job marks the latest release, by version.
          gh release create "$RELEASE_TAG" "${files[@]}" SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Downpad $version" \
            --latest=false \
            "${kind[@]}"

  # A separate job, so a rerun of a failed cleanup does not publish again.
  # Stable releases finish one at a time, across tags.
  finalize:
    name: Finish stable release
    needs: [prepare, release]
    if: ${{ !cancelled() && needs.release.result == 'success' && startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-rc') }}
    concurrency:
      group: finish-stable-release
      cancel-in-progress: false
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out workflow controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      # Installed copies update to the latest release, so it must be the
      # newest version, also when publications finish out of order.
      - name: Mark the newest stable release as the latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs latest

      - name: Remove superseded releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs prune --released-tag "$GITHUB_REF_NAME" --apply
