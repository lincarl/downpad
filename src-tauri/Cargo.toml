[package]
name = "md-easy"
version = "0.2.2"
description = "A lightweight, pure-WYSIWYG markdown editor"
authors = ["md-easy contributors"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "md_easy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
toml = "0.8"
toml_edit = "0.22"
notify = "6"
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
# Printing goes through WebView2's own print API so the browser print dialog (and
# the URL/date banner it stamps on each sheet) never appears — see
# commands/printing.rs and spec §5.21. Versions track the ones Tauri/wry already
# resolve, so no second copy of the bindings is pulled in.
webview2-com = "0.38"
windows-core = "0.61"
